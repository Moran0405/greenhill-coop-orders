# =============================================================
# Greenhill Food Co-op Weekly Ordering System
# Default (development) configuration
# =============================================================
spring.application.name=greenhill-coop-orders
server.port=8080

# --- Coordinator sign-in -------------------------------------
# Shared pass phrase used by the volunteer coordinator.
# Override in production via COORDINATOR_PASSWORD or application-prod.properties.
app.coordinator.password=${COORDINATOR_PASSWORD:coop-admin-2026}

# --- Database: MySQL 8 ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/greenhill_coop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Australia/Brisbane
spring.datasource.username=${DB_USERNAME:coop_user}
spring.datasource.password=${DB_PASSWORD:coop_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---------------------------------------------------
logging.level.com.greenhill.coop=INFO
