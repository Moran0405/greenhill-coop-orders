# Test configuration - H2 in-memory database keeps the suite
# independent from a running MySQL server.
spring.datasource.url=jdbc:h2:mem:cooptest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.coordinator.password=coop-admin-2026
